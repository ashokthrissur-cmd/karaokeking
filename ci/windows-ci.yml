name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pyinstaller

      - name: Run test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --timeout=300

      - name: Build single-file executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean abikaraoke.spec

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          $exe = "dist/ABI_Karaoke.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Frozen exe failed --version" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if (-not $version) { throw "pyproject.toml has no version." }
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$version" "installer/KaraokeForge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: ABI-Karaoke-windows-x64
          path: |
            dist/ABI_Karaoke.exe
            publish/installer/ABI_Karaoke_Setup_*_x64.exe
          if-no-files-found: error
          retention-days: 30
